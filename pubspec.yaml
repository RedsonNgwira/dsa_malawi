name: dsa_malawi
description: DSA Malawi - Direct Sales Agent Tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Camera & image
  camera: ^0.11.0+2
  image: ^4.3.0
  image_picker: ^1.1.2
  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.2
  # Word (.docx) export
  docx_template: ^0.3.4
  # File system & sharing
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.1.2
  # URL launching & email
  url_launcher: ^6.3.1
  flutter_email_sender: ^6.0.3
  # PDF viewer
  flutter_pdfview: ^1.3.2
  # Permissions
  permission_handler: ^11.3.1
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  # State management
  provider: ^6.1.2
  # Local database
  sqflite: ^2.4.1
  # Image compression
  flutter_image_compress: ^2.3.0
  # GPS location
  geolocator: ^13.0.2
  # Network connectivity
  connectivity_plus: ^6.1.1
  # Real-time edge detection
  edge_detection_scan: ^0.0.1
  # OCR text recognition
  google_mlkit_text_recognition: ^0.15.1
  get_it: ^9.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
