name: Build & Release Android APKs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Auto-increment version tag (v1, v2, v3 ...)
      - name: Generate version tag
        id: tag
        run: |
          git fetch --tags
          LAST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+$' | head -1)
          if [ -z "$LAST" ]; then
            NEXT="v1"
          else
            NUM=${LAST#v}
            NEXT="v$((NUM + 1))"
          fi
          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT"

      # Per-ABI builds
      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Build armeabi-v7a APK
        run: flutter build apk --release --target-platform android-arm --split-per-abi

      - name: Build x86_64 APK
        run: flutter build apk --release --target-platform android-x64 --split-per-abi

      # Universal APK
      - name: Build universal APK
        run: flutter build apk --release

      # Rename for clarity
      - name: Rename APKs
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk    dsa-malawi-${TAG}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk  dsa-malawi-${TAG}-armeabi-v7a.apk
          mv app-x86_64-release.apk       dsa-malawi-${TAG}-x86_64.apk
          mv app-release.apk              dsa-malawi-${TAG}-universal.apk

      # Create tag + GitHub Release with all APKs attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "DSA Malawi ${{ steps.tag.outputs.tag }}"
          body: |
            Automated release from commit ${{ github.sha }}
            
            **Download the right APK for your device:**
            - `arm64-v8a` — modern Android phones (recommended)
            - `armeabi-v7a` — older/budget phones
            - `x86_64` — emulators
            - `universal` — works on all devices (largest file)
          files: |
            build/app/outputs/flutter-apk/dsa-malawi-${{ steps.tag.outputs.tag }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/dsa-malawi-${{ steps.tag.outputs.tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/dsa-malawi-${{ steps.tag.outputs.tag }}-x86_64.apk
            build/app/outputs/flutter-apk/dsa-malawi-${{ steps.tag.outputs.tag }}-universal.apk
