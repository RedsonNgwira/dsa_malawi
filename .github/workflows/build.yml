name: Build & Release Android APKs

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.2'

jobs:
  # ── Static checks (fast, runs first) ──
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/
            .packages
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ── Generate version tag ──
  tag:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: tag
        run: |
          git fetch --tags
          LAST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+$' | head -1)
          if [ -z "$LAST" ]; then
            NEXT="v1"
          else
            NUM=${LAST#v}
            NEXT="v$((NUM + 1))"
          fi
          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT"

  # ── Parallel per-ABI builds ──
  build:
    name: Build ${{ matrix.target }}
    needs: [check, tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: arm64-v8a
            platform: android-arm64
            abi: arm64-v8a
          - target: armeabi-v7a
            platform: android-arm
            abi: armeabi-v7a
          - target: x86_64
            platform: android-x64
            abi: x86_64
      # Fail fast: stop all builds if one fails
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── Pub cache ──
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/
            .packages
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      # ── Gradle cache ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }} APK
        run: flutter build apk --release --target-platform ${{ matrix.platform }} --split-per-abi

      - name: Rename APK
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          cd build/app/outputs/flutter-apk/
          mv app-${{ matrix.abi }}-release.apk dsa-malawi-${TAG}-${{ matrix.abi }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target }}
          path: build/app/outputs/flutter-apk/dsa-malawi-${{ needs.tag.outputs.tag }}-${{ matrix.abi }}.apk

  # ── Create Release (after all builds finish) ──
  release:
    name: Create Release
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "DSA Malawi ${{ needs.tag.outputs.tag }}"
          body: |
            Automated release from commit ${{ github.sha }}

            **Download the right APK for your device:**
            - `arm64-v8a` — modern Android phones (recommended)
            - `armeabi-v7a` — older/budget phones
            - `x86_64` — emulators only
          files: apks/*.apk
