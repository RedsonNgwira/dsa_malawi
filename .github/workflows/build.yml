name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Per-ABI APKs (smaller, targeted installs)
      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
        
      - name: Build armeabi-v7a APK
        run: flutter build apk --release --target-platform android-arm --split-per-abi

      - name: Build x86_64 APK
        run: flutter build apk --release --target-platform android-x64 --split-per-abi

      # Universal APK (works on all architectures)
      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-malawi-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-malawi-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-malawi-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: dsa-malawi-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      # Attach all APKs to GitHub Release when a release is created
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
